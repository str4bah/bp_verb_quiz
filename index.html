<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>ポルトガル語 動詞活用ドリル</title>
<style>
:root{
  --bg:#f6f5f1;
  --card:#ffffff;
  --ink:#2c2c2a;
  --ink-2:#5f5e5a;
  --ink-3:#888780;
  --line:#e2e0d8;
  --line-strong:#c9c6ba;
  --accent:#185fa5;
  --accent-bg:#e6f1fb;
  --good:#3b6d11;
  --good-bg:#eaf3de;
  --bad:#a32d2d;
  --bad-bg:#fcebeb;
  --t1:#e06666;
  --t2:#f6b26b;
  --t3:#e8c341;
  --t4:#93c47d;
  --radius:12px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#1c1c1a;
    --card:#262625;
    --ink:#f1efe8;
    --ink-2:#c7c5ba;
    --ink-3:#928f84;
    --line:#3a3a37;
    --line-strong:#4c4b46;
    --accent:#85b7eb;
    --accent-bg:#0c447c;
    --good:#c0dd97;
    --good-bg:#27500a;
    --bad:#f09595;
    --bad-bg:#501313;
  }
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;
  -webkit-tap-highlight-color:transparent;}
body{padding:0 0 3rem;}
.wrap{max-width:520px;margin:0 auto;padding:0 16px;}
header.top{padding:20px 16px 8px;max-width:520px;margin:0 auto;}
h1{font-size:19px;font-weight:500;margin:0 0 2px;}
.sub{font-size:13px;color:var(--ink-2);margin:0;}
.tabs{display:flex;gap:4px;margin:16px 0;background:var(--line);padding:3px;border-radius:10px;}
.tab-btn{flex:1;padding:9px 4px;border:none;background:transparent;border-radius:8px;
  font-size:13px;color:var(--ink-2);cursor:pointer;font-family:inherit;}
.tab-btn.active{background:var(--card);color:var(--ink);font-weight:500;box-shadow:0 1px 2px rgba(0,0,0,0.06);}
.panel{display:none;}
.panel.active{display:block;}

/* ---- settings ---- */
details.settings{background:var(--card);border:0.5px solid var(--line);border-radius:var(--radius);margin-bottom:14px;}
details.settings summary{padding:12px 14px;font-size:14px;font-weight:500;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;}
details.settings summary::-webkit-details-marker{display:none;}
summary .chev{transition:transform .15s;color:var(--ink-3);}
details[open] summary .chev{transform:rotate(180deg);}
.settings-body{padding:0 14px 14px;}
.field-label{font-size:12px;color:var(--ink-2);margin:12px 0 6px;}
.field-label:first-child{margin-top:0;}
.chip-row{display:flex;flex-wrap:wrap;gap:6px;}
.chip{padding:6px 12px;border-radius:999px;border:0.5px solid var(--line-strong);
  background:transparent;font-size:12.5px;color:var(--ink-2);cursor:pointer;font-family:inherit;}
.chip.on{background:var(--accent-bg);color:var(--accent);border-color:var(--accent);font-weight:500;}
.tier-chip.on[data-tier="1"]{background:var(--t1);color:#4a1b0c;border-color:var(--t1);}
.tier-chip.on[data-tier="2"]{background:var(--t2);color:#412402;border-color:var(--t2);}
.tier-chip.on[data-tier="3"]{background:var(--t3);color:#412402;border-color:var(--t3);}
.tier-chip.on[data-tier="4"]{background:var(--t4);color:#173404;border-color:var(--t4);}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;
  border-top:0.5px solid var(--line);font-size:13.5px;}
.toggle-row:first-of-type{border-top:none;}
.switch{position:relative;width:38px;height:22px;flex-shrink:0;}
.switch input{opacity:0;width:0;height:0;}
.slider{position:absolute;inset:0;background:var(--line-strong);border-radius:999px;cursor:pointer;transition:.15s;}
.slider::before{content:"";position:absolute;width:18px;height:18px;left:2px;top:2px;background:#fff;border-radius:50%;transition:.15s;}
input:checked + .slider{background:var(--accent);}
input:checked + .slider::before{transform:translateX(16px);}
.count-line{font-size:12px;color:var(--ink-3);margin-top:10px;text-align:right;}

/* ---- quiz card ---- */
.stat-row{display:flex;gap:10px;margin-bottom:14px;}
.stat{flex:1;background:var(--card);border-radius:var(--radius);padding:10px 12px;text-align:center;}
.stat .n{font-size:20px;font-weight:500;line-height:1.2;}
.stat .l{font-size:11px;color:var(--ink-3);margin-top:1px;}

.qcard{background:var(--card);border-radius:16px;border:0.5px solid var(--line);padding:22px 20px 20px;text-align:center;min-height:200px;display:flex;flex-direction:column;justify-content:center;gap:4px;}
.q-empty{font-size:14px;color:var(--ink-2);padding:20px 0;}
.badge-row{display:flex;justify-content:center;gap:6px;margin-bottom:14px;flex-wrap:wrap;}
.badge{font-size:11.5px;padding:3px 9px;border-radius:999px;font-weight:500;}
.badge.tier1{background:var(--t1);color:#4a1b0c;}
.badge.tier2{background:var(--t2);color:#412402;}
.badge.tier3{background:var(--t3);color:#412402;}
.badge.tier4{background:var(--t4);color:#173404;}
.badge.grp{background:var(--line);color:var(--ink-2);}
.verb-word{font-size:30px;font-weight:500;letter-spacing:.2px;}
.tense-line{font-size:14px;color:var(--accent);margin-top:6px;font-weight:500;}
.person-line{font-size:14.5px;color:var(--ink-2);margin-top:2px;}
.person-line b{color:var(--ink);font-weight:500;}

.answer-row{margin-top:18px;display:flex;gap:8px;}
.answer-row input[type=text]{flex:1;font-size:18px;padding:0 14px;text-align:center;}
.fb{margin-top:14px;border-radius:10px;padding:10px 12px;font-size:14px;text-align:left;display:none;}
.fb.show{display:block;}
.fb.good{background:var(--good-bg);color:var(--good);}
.fb.bad{background:var(--bad-bg);color:var(--bad);}
.fb .correct-form{font-weight:500;font-size:16px;margin-top:2px;}
.fb .alt{font-size:12.5px;opacity:.85;margin-top:2px;}

.btn-row{display:flex;gap:8px;margin-top:14px;}
.btn-row button{flex:1;}
button{font-family:inherit;}
.btn-secondary{background:transparent;border:0.5px solid var(--line-strong);border-radius:10px;padding:11px;font-size:14px;color:var(--ink-2);cursor:pointer;}
.btn-primary{background:var(--accent);border:none;border-radius:10px;padding:11px;font-size:14px;color:#fff;font-weight:500;cursor:pointer;}
.btn-primary:active,.btn-secondary:active{transform:scale(.98);}

/* ---- reference table ---- */
.ref-select{width:100%;padding:10px 12px;font-size:15px;border-radius:10px;border:0.5px solid var(--line-strong);background:var(--card);color:var(--ink);margin-bottom:14px;}
.ref-table-wrap{overflow-x:auto;border:0.5px solid var(--line);border-radius:12px;background:var(--card);}
table.ref{border-collapse:collapse;width:100%;font-size:12.5px;min-width:640px;}
table.ref th, table.ref td{padding:8px 9px;border-bottom:0.5px solid var(--line);text-align:center;white-space:nowrap;}
table.ref th{color:var(--ink-2);font-weight:500;background:var(--bg);position:sticky;top:0;}
table.ref td:first-child, table.ref th:first-child{position:sticky;left:0;background:var(--card);text-align:left;font-weight:500;z-index:1;}
table.ref th:first-child{background:var(--bg);z-index:2;}
td.tier1{background:color-mix(in srgb, var(--t1) 28%, transparent);}
td.tier2{background:color-mix(in srgb, var(--t2) 24%, transparent);}
td.tier3{background:color-mix(in srgb, var(--t3) 22%, transparent);}
td.tier4{background:color-mix(in srgb, var(--t4) 22%, transparent);}
.legend-line{display:flex;gap:12px;flex-wrap:wrap;margin:10px 2px 16px;font-size:11.5px;color:var(--ink-2);}
.legend-line span{display:inline-flex;align-items:center;gap:4px;}
.legend-dot{width:9px;height:9px;border-radius:3px;display:inline-block;}

/* ---- stats tab ---- */
.stats-card{background:var(--card);border:0.5px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px;}
.stats-card h3{font-size:14px;font-weight:500;margin:0 0 10px;}
.bar-row{display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:8px;}
.bar-row .name{width:64px;flex-shrink:0;color:var(--ink-2);}
.bar-track{flex:1;height:8px;background:var(--line);border-radius:999px;overflow:hidden;}
.bar-fill{height:100%;background:var(--accent);border-radius:999px;}
.bar-row .pct{width:38px;text-align:right;color:var(--ink-3);font-size:12px;flex-shrink:0;}
.miss-item{display:flex;justify-content:space-between;padding:8px 0;border-top:0.5px solid var(--line);font-size:13px;}
.miss-item:first-child{border-top:none;}
.miss-item .acc{color:var(--bad);font-weight:500;}
.reset-btn{width:100%;margin-top:4px;}
.empty-note{font-size:13px;color:var(--ink-3);text-align:center;padding:20px 0;}

/* ---- stats filter controls ---- */
.quick-row{display:flex;gap:8px;margin-top:8px;}
.chip-mini{padding:5px 10px;border-radius:999px;border:0.5px solid var(--line-strong);
  background:transparent;font-size:11.5px;color:var(--ink-2);cursor:pointer;font-family:inherit;}
.chip-mini:active{transform:scale(.97);}
select.ref-select{margin-bottom:0;}
.range-note{font-size:11.5px;color:var(--ink-3);margin-top:8px;line-height:1.5;}

/* ---- matrix table ---- */
.matrix-wrap{overflow-x:auto;border:0.5px solid var(--line);border-radius:12px;background:var(--card);}
table.matrix{border-collapse:collapse;width:100%;font-size:11.5px;min-width:560px;}
table.matrix th, table.matrix td{padding:7px 5px;border-bottom:0.5px solid var(--line);text-align:center;white-space:nowrap;}
table.matrix th{color:var(--ink-2);font-weight:500;background:var(--bg);}
table.matrix td:first-child, table.matrix th:first-child{position:sticky;left:0;background:var(--card);text-align:left;font-weight:500;z-index:1;padding-left:9px;}
table.matrix th:first-child{background:var(--bg);z-index:2;}
table.matrix .pct{font-weight:500;}
table.matrix .cnt{font-size:10px;color:var(--ink-3);margin-top:1px;}
td.acc-a{background:color-mix(in srgb, var(--good) 30%, transparent);}
td.acc-a .pct{color:var(--good);}
td.acc-b{background:color-mix(in srgb, var(--good) 12%, transparent);}
td.acc-c{background:color-mix(in srgb, var(--t2) 24%, transparent);}
td.acc-d{background:color-mix(in srgb, var(--bad) 22%, transparent);}
td.acc-d .pct{color:var(--bad);}
td.acc-none{color:var(--ink-3);}
</style>
</head>
<body>
<header class="top">
  <h1>ポルトガル語 動詞活用ドリル</h1>
  <p class="sub">動詞・時制・主語を見て活用形を答えよう</p>
</header>

<div class="wrap">
  <div class="tabs">
    <button class="tab-btn active" data-tab="quiz">クイズ</button>
    <button class="tab-btn" data-tab="ref">動詞表</button>
    <button class="tab-btn" data-tab="stats">成績</button>
  </div>

  <!-- QUIZ TAB -->
  <div class="panel active" id="panel-quiz">
    <details class="settings" id="settingsBox">
      <summary>出題設定 <i class="chev">▾</i></summary>
      <div class="settings-body">
        <div class="field-label">動詞グループ</div>
        <div class="chip-row" id="groupChips">
          <button class="chip on" data-val="all">すべて</button>
          <button class="chip" data-val="regular">規則活用のみ</button>
          <button class="chip" data-val="irregular">不規則動詞のみ</button>
        </div>

        <div class="field-label">対象動詞（個別選択）</div>
        <div class="chip-row" id="verbChips"></div>
        <div class="quick-row">
          <button class="chip-mini" id="verbAllBtn">すべて選択</button>
          <button class="chip-mini" id="verbNoneBtn">最小構成にする</button>
        </div>

        <div class="field-label">優先度（Tier）</div>
        <div class="chip-row" id="tierChips"></div>

        <div class="field-label">時制</div>
        <div class="chip-row" id="tenseChips"></div>

        <div class="field-label">主語</div>
        <div class="chip-row" id="personChips"></div>

        <div class="toggle-row">
          <span>アクセント記号を無視して判定</span>
          <label class="switch"><input type="checkbox" id="ignoreAccents"><span class="slider"></span></label>
        </div>
        <div class="toggle-row">
          <span>苦手な問題を優先的に出題</span>
          <label class="switch"><input type="checkbox" id="weakFirst" checked><span class="slider"></span></label>
        </div>
        <div class="count-line" id="poolCount"></div>
      </div>
    </details>

    <div class="stat-row">
      <div class="stat"><div class="n" id="statScore">0 / 0</div><div class="l">今回の正解</div></div>
      <div class="stat"><div class="n" id="statStreak">0</div><div class="l">連続正解</div></div>
    </div>

    <div class="qcard" id="qcard">
      <div class="q-empty" id="qEmpty">条件に合う問題がありません。設定を見直してください。</div>
      <div id="qBody" style="display:none;">
        <div class="badge-row" id="qBadges"></div>
        <div class="verb-word" id="qVerb"></div>
        <div class="tense-line" id="qTense"></div>
        <div class="person-line" id="qPerson"></div>
        <div class="answer-row">
          <input type="text" id="answerInput" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="活用形を入力">
        </div>
        <div class="fb" id="fb"></div>
        <div class="btn-row">
          <button class="btn-secondary" id="skipBtn">わからない</button>
          <button class="btn-primary" id="submitBtn">答える</button>
        </div>
      </div>
    </div>
  </div>

  <!-- REFERENCE TAB -->
  <div class="panel" id="panel-ref">
    <select class="ref-select" id="refVerbSelect"></select>
    <div class="ref-table-wrap"><table class="ref" id="refTable"></table></div>
    <div class="legend-line">
      <span><i class="legend-dot" style="background:var(--t1)"></i>Tier1 最優先</span>
      <span><i class="legend-dot" style="background:var(--t2)"></i>Tier2 高</span>
      <span><i class="legend-dot" style="background:var(--t3)"></i>Tier3 中</span>
      <span><i class="legend-dot" style="background:var(--t4)"></i>Tier4 低</span>
    </div>
  </div>

  <!-- STATS TAB -->
  <div class="panel" id="panel-stats">
    <div class="stats-card">
      <h3>集計対象の設定</h3>
      <div class="field-label">対象動詞</div>
      <div class="chip-row" id="statsVerbChips"></div>
      <div class="quick-row">
        <button class="chip-mini" id="statsVerbAllBtn">すべて選択</button>
        <button class="chip-mini" id="statsVerbNoneBtn">最小構成にする</button>
      </div>
      <div class="field-label">集計期間</div>
      <select class="ref-select" id="statsRangeSelect">
        <option value="all">全期間（累計）</option>
        <option value="count:20">直近20問</option>
        <option value="count:50">直近50問</option>
        <option value="count:100">直近100問</option>
        <option value="count:200">直近200問</option>
        <option value="days:7">直近7日</option>
        <option value="days:14">直近14日</option>
        <option value="days:30">直近30日</option>
        <option value="days:90">直近90日</option>
      </select>
      <div class="range-note" id="statsRangeNote"></div>
    </div>
    <div class="stats-card">
      <h3>主語 × 時制 正答率マトリクス</h3>
      <div class="matrix-wrap"><table class="matrix" id="matrixTable"></table></div>
    </div>
    <div class="stats-card">
      <h3>苦手な組み合わせ トップ10</h3>
      <div id="weakList"></div>
    </div>
    <button class="btn-secondary reset-btn" id="resetStatsBtn">成績をリセット</button>
  </div>
</div>

const LS_STATS = 'ptquiz_stats_v1';
const LS_SETTINGS = 'ptquiz_settings_v1';
const LS_HISTORY = 'ptquiz_history_v1';
const LS_STATS_FILTER = 'ptquiz_statsfilter_v1';
const MAX_HISTORY = 10000; // 直近データの保持上限（詳細は下部コメント参照）

function loadJSON(key, fallback){
  try{
    const raw = localStorage.getItem(key);
    if(!raw) return fallback;
    return JSON.parse(raw);
  }catch(e){ return fallback; }
}
function saveJSON(key, val){
  try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){}
}

/*
 * 成績データの蓄積方式（2階建て）
 * 1) stats[id] = {c,w} … 各問題（動詞×時制×主語）ごとの累計正解/不正解数。
 *    件数無制限で永続的に積み上がる軽量カウンタ。「全期間」集計と、
 *    出題時の重み付け（苦手優先）はこちらを使用する。
 * 2) history = [[id, ok(0/1), timestamp], ...] … 回答1件ごとのログ。
 *    「直近n問」「直近n日」といった期間指定の集計に使うため時刻を保持する。
 *    無制限に増やすとlocalStorage容量を圧迫するため、直近 MAX_HISTORY 件
 *    （既定10,000件。1日50問×1年弱に相当）を超えたら古い方から自動的に
 *    間引く。これにより「全期間」以外の集計は保持件数の範囲でのみ
 *    正確になる（UI側に保持件数と該当件数を注記して透明性を確保する）。
 */
let stats = loadJSON(LS_STATS, {});
let history = loadJSON(LS_HISTORY, []);
let settings = loadJSON(LS_SETTINGS, null);
let statsFilter = loadJSON(LS_STATS_FILTER, null);

const allVerbs = [...new Set(ITEMS.map(i=>i.verb))];
const allTiers = [1,2,3,4];
const itemById = {};
ITEMS.forEach(i=>{ itemById[i.id] = i; });

if(!settings){
  settings = {
    group: 'all',
    verbs: [...allVerbs],
    tiers: [1,2,3,4],
    cats: CATS.map(c=>c[0]),
    persons: [...new Set(ITEMS.map(i=>i.personPt))],
    ignoreAccents: false,
    weakFirst: true
  };
}
if(!settings.verbs || !settings.verbs.length) settings.verbs = [...allVerbs];

if(!statsFilter){
  statsFilter = { verbs: [...allVerbs], range: 'all' };
}
if(!statsFilter.verbs || !statsFilter.verbs.length) statsFilter.verbs = [...allVerbs];
if(!statsFilter.range) statsFilter.range = 'all';

function persistSettings(){ saveJSON(LS_SETTINGS, settings); }
function persistStatsFilter(){ saveJSON(LS_STATS_FILTER, statsFilter); }

document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('panel-'+btn.dataset.tab).classList.add('active');
    if(btn.dataset.tab === 'ref') renderRefTable();
    if(btn.dataset.tab === 'stats') renderStats();
  });
});

const tierChipsEl = document.getElementById('tierChips');
const tierNames = {1:'Tier1',2:'Tier2',3:'Tier3',4:'Tier4'};
allTiers.forEach(t=>{
  const b = document.createElement('button');
  b.className = 'chip tier-chip' + (settings.tiers.includes(t) ? ' on':'');
  b.dataset.tier = t;
  b.textContent = tierNames[t];
  b.addEventListener('click', ()=>{
    const idx = settings.tiers.indexOf(t);
    if(idx>=0){ if(settings.tiers.length>1) settings.tiers.splice(idx,1); }
    else settings.tiers.push(t);
    b.classList.toggle('on');
    persistSettings(); refreshPool(); newQuestion();
  });
  tierChipsEl.appendChild(b);
});

CATS.forEach(([key,label])=>{

  b.textContent = label;
  b.addEventListener('click', ()=>{
    const idx = settings.cats.indexOf(key);
    if(idx>=0){ if(settings.cats.length>1) settings.cats.splice(idx,1); }
    else settings.cats.push(key);
    b.classList.toggle('on');
    persistSettings(); refreshPool(); newQuestion();
  });
  tenseChipsEl.appendChild(b);
});

    b.classList.add('on');
    settings.group = b.dataset.val;
    persistSettings(); refreshPool(); newQuestion();
  });
});
document.getElementById('groupChips').querySelectorAll('.chip').forEach(b=>{
  if(b.dataset.val === settings.group) b.classList.add('on'); else b.classList.remove('on');
});

/* ---------- individual verb selection (quiz settings) ---------- */
const verbChipsEl = document.getElementById('verbChips');
function buildVerbChip(container, verb, selectedList, onToggle){
  const b = document.createElement('button');
  b.className = 'chip' + (selectedList.includes(verb) ? ' on':'');
  b.dataset.val = verb;
  b.textContent = verb;
  b.addEventListener('click', ()=>{
    const idx = selectedList.indexOf(verb);
    if(idx>=0){ if(selectedList.length>1) selectedList.splice(idx,1); }
    else selectedList.push(verb);
    b.classList.toggle('on');
    onToggle();
  });
  container.appendChild(b);
  return b;
}
allVerbs.forEach(v=>{
  buildVerbChip(verbChipsEl, v, settings.verbs, ()=>{ persistSettings(); refreshPool(); newQuestion(); });
});
document.getElementById('verbAllBtn').addEventListener('click', ()=>{
  settings.verbs = [...allVerbs];
  verbChipsEl.querySelectorAll('.chip').forEach(b=>b.classList.add('on'));
  persistSettings(); refreshPool(); newQuestion();
});
document.getElementById('verbNoneBtn').addEventListener('click', ()=>{
  settings.verbs = [allVerbs[0]];
  verbChipsEl.querySelectorAll('.chip').forEach(b=>{

  });

});

const ignoreAccentsEl = document.getElementById('ignoreAccents');
ignoreAccentsEl.checked = settings.ignoreAccents;
ignoreAccentsEl.addEventListener('change', ()=>{ settings.ignoreAccents = ignoreAccentsEl.checked; persistSettings(); });

const weakFirstEl = document.getElementById('weakFirst');
weakFirstEl.checked = settings.weakFirst;
weakFirstEl.addEventListener('change', ()=>{ settings.weakFirst = weakFirstEl.checked; persistSettings(); });

/* ---------- pool ---------- */
let pool = [];
function refreshPool(){
  pool = ITEMS.filter(i=>{
    if(settings.group !== 'all' && i.group !== settings.group) return false;
    if(!settings.verbs.includes(i.verb)) return false;
    if(!settings.tiers.includes(i.tier)) return false;
    if(!i.cats.some(c=>settings.cats.includes(c))) return false;
    if(!settings.persons.includes(i.personPt)) return false;
    return true;
  });
  document.getElementById('poolCount').textContent = pool.length + ' 問が対象';
}

/* ---------- accent-insensitive compare ---------- */
function normalize(s, ignoreAcc){
  s = s.trim().toLowerCase();
  if(ignoreAcc){
    s = s.normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  }
  return s;
}

function weightFor(item){
  const st = stats[item.id];
  if(!st || st.c + st.w === 0) return 3;
  const acc = st.c / (st.c + st.w);
  return 1 + (1 - acc) * 5;
}

function pickItem(){
  if(pool.length === 0) return null;
  if(!settings.weakFirst){
    return pool[Math.floor(Math.random()*pool.length)];
  }
  let total = 0;
  const weights = pool.map(it=>{ const w = weightFor(it); total += w; return w; });
  let r = Math.random()*total;
  for(let i=0;i<pool.length;i++){
    r -= weights[i];
    if(r<=0) return pool[i];
  }
  return pool[pool.length-1];
}

let current = null;
let sessionCorrect = 0, sessionTotal = 0, streak = 0;

function recordResult(item, correct){
  if(!stats[item.id]) stats[item.id] = {c:0,w:0};
  if(correct) stats[item.id].c++; else stats[item.id].w++;
  saveJSON(LS_STATS, stats);

  history.push([item.id, correct ? 1 : 0, Date.now()]);
  if(history.length > MAX_HISTORY){
    history.splice(0, history.length - MAX_HISTORY);
  }
  saveJSON(LS_HISTORY, history);
}

function newQuestion(){
  document.getElementById('fb').className = 'fb';
  document.getElementById('fb').textContent = '';
  const input = document.getElementById('answerInput');
  input.value = '';
  input.disabled = false;
  document.getElementById('submitBtn').textContent = '答える';

  if(pool.length === 0){
    document.getElementById('qEmpty').style.display = 'block';
    document.getElementById('qBody').style.display = 'none';
    return;
  }
  document.getElementById('qEmpty').style.display = 'none';
  document.getElementById('qBody').style.display = 'block';

  current = pickItem();
  const badges = document.getElementById('qBadges');
  badges.innerHTML = '';
  const tierB = document.createElement('span');
  tierB.className = 'badge tier'+current.tier;
  tierB.textContent = 'Tier '+current.tier;
  badges.appendChild(tierB);
  const grpB = document.createElement('span');
  grpB.className = 'badge grp';
  grpB.textContent = current.group === 'regular' ? '規則活用' : '不規則動詞';
  badges.appendChild(grpB);

  document.getElementById('qVerb').textContent = current.verb;
  document.getElementById('qTense').textContent = current.tenseJp + '（' + current.tensePt + '）';
  document.getElementById('qPerson').innerHTML = '主語: <b>'+current.personPt+'</b>　'+current.personJp;

  setTimeout(()=>input.focus(), 30);
}

function acceptedAnswers(item){
  return item.answer.split('/').map(s=>s.trim());
}

function submitAnswer(){
  const input = document.getElementById('answerInput');
  const val = input.value;
  if(val.trim() === ''){
    const fb = document.getElementById('fb');
    fb.className = 'fb show bad';
    fb.textContent = '答えを入力してください';
    return;
  }
  const accepted = acceptedAnswers(current);
  const ignoreAcc = settings.ignoreAccents;
  const norm = normalize(val, ignoreAcc);
  const correct = accepted.some(a => normalize(a, ignoreAcc) === norm);

  sessionTotal++;
  if(correct){ sessionCorrect++; streak++; } else { streak = 0; }
  recordResult(current, correct);
  updateStatDisplay();

  const fb = document.getElementById('fb');
  fb.className = 'fb show ' + (correct ? 'good':'bad');
  if(correct){
    fb.innerHTML = '正解！';
  } else {
    fb.innerHTML = '不正解<div class="correct-form">正解: '+accepted[0]+'</div>' +
      (accepted.length>1 ? '<div class="alt">別解: '+accepted.slice(1).join(', ')+'</div>' : '');
  }
  input.disabled = true;
  document.getElementById('submitBtn').textContent = '次の問題へ';
}

function updateStatDisplay(){
  document.getElementById('statScore').textContent = sessionCorrect + ' / ' + sessionTotal;
  document.getElementById('statStreak').textContent = streak;
}

document.getElementById('submitBtn').addEventListener('click', ()=>{
  const input = document.getElementById('answerInput');
  if(input.disabled){ newQuestion(); } else { submitAnswer(); }
});
document.getElementById('skipBtn').addEventListener('click', ()=>{
  const input = document.getElementById('answerInput');
  if(input.disabled){ newQuestion(); return; }
  sessionTotal++; streak = 0;
  recordResult(current, false);
  updateStatDisplay();
  const fb = document.getElementById('fb');
  fb.className = 'fb show bad';
  const accepted = acceptedAnswers(current);
  fb.innerHTML = '正解: <div class="correct-form">'+accepted[0]+'</div>' +
    (accepted.length>1 ? '<div class="alt">別解: '+accepted.slice(1).join(', ')+'</div>' : '');
  input.disabled = true;
  document.getElementById('submitBtn').textContent = '次の問題へ';
});
document.getElementById('answerInput').addEventListener('keydown', (e)=>{
  if(e.key === 'Enter'){
    e.preventDefault();
    const input = document.getElementById('answerInput');
    if(input.disabled){ newQuestion(); } else { submitAnswer(); }
  }
});

/* ---------- reference table ---------- */

allVerbs.forEach(v=>{

  refSelect.appendChild(opt);

function renderRefTable(){

allVerbs.forEach(v=>{

});

/* ---------- stats tab: data aggregation ---------- */
function filteredHistoryEntries(){
  const verbSet = new Set(statsFilter.verbs);
  let entries = history.filter(([id])=>{
    const it = itemById[id];
    return it && verbSet.has(it.verb);
  });
  if(statsFilter.range === 'all') return entries;
  const [kind, valStr] = statsFilter.range.split(':');
  const val = parseInt(valStr, 10);
  if(kind === 'count'){
    entries = entries.slice(-val);
  } else if(kind === 'days'){
    const cutoff = Date.now() - val*24*60*60*1000;
    entries = entries.filter(([,,t])=> t >= cutoff);
  }
  return entries;
}

function computeMatrixData(){
  const persons = [...new Set(ITEMS.map(i=>i.personPt))];
  const matrix = {};
  persons.forEach(p=>{
    matrix[p] = {};
    CATS.forEach(([k])=>{ matrix[p][k] = {c:0, w:0}; });
  });

  if(statsFilter.range === 'all'){
    const verbSet = new Set(statsFilter.verbs);
    ITEMS.forEach(item=>{
      if(!verbSet.has(item.verb)) return;
      const st = stats[item.id];
      if(!st) return;
      item.cats.forEach(c=>{
        matrix[item.personPt][c].c += st.c;
        matrix[item.personPt][c].w += st.w;
      });
    });
    return {matrix, persons, mode:'all'};
  }

  const entries = filteredHistoryEntries();
  entries.forEach(([id, ok])=>{
    const item = itemById[id];
    if(!item) return;
    item.cats.forEach(c=>{
      if(ok) matrix[item.personPt][c].c++; else matrix[item.personPt][c].w++;
    });
  });
  return {matrix, persons, mode:'recent', count: entries.length};
}

function computeWeakList(){
  const verbSet = new Set(statsFilter.verbs);
  if(statsFilter.range === 'all'){
    return ITEMS.filter(item=>verbSet.has(item.verb)).map(item=>{
      const st = stats[item.id];
      if(!st || (st.c+st.w) < 2) return null;
      return {item, acc: st.c/(st.c+st.w), total: st.c+st.w};
    }).filter(Boolean).sort((a,b)=>a.acc-b.acc).slice(0,10);
  }
  const entries = filteredHistoryEntries();
  const agg = {};
  entries.forEach(([id, ok])=>{
    if(!agg[id]) agg[id] = {c:0,w:0};
    if(ok) agg[id].c++; else agg[id].w++;
  });
  return Object.keys(agg).map(id=>{
    const item = itemById[id];
    const st = agg[id];
    if(!item || (st.c+st.w) < 2) return null;
    return {item, acc: st.c/(st.c+st.w), total: st.c+st.w};
  }).filter(Boolean).sort((a,b)=>a.acc-b.acc).slice(0,10);
}

/* ---------- stats tab: rendering ---------- */
function renderMatrixTable(result){
  const { matrix, persons } = result;
  let html = '<thead><tr><th>主語</th>';
  CATS.forEach(([key,label])=>{ html += '<th>'+label+'</th>'; });
  html += '</tr></thead><tbody>';
  let anyData = false;
  persons.forEach(p=>{
    html += '<tr><td>'+p+'</td>';
    CATS.forEach(([key])=>{
      const cell = matrix[p][key];
      const total = cell.c + cell.w;
      if(total === 0){
        html += '<td class="acc-none">-</td>';
      } else {
        anyData = true;
        const pct = Math.round(cell.c/total*100);
        const cls = pct>=90 ? 'acc-a' : pct>=70 ? 'acc-b' : pct>=50 ? 'acc-c' : 'acc-d';
        html += '<td class="'+cls+'"><div class="pct">'+pct+'%</div><div class="cnt">'+cell.c+'/'+total+'</div></td>';
      }
    });
    html += '</tr>';
  });
  html += '</tbody>';
  document.getElementById('matrixTable').innerHTML = html;
  return anyData;
}

function updateStatsRangeNote(result){
  const note = document.getElementById('statsRangeNote');
  if(result.mode === 'all'){
    note.textContent = '累計の正解/不正解カウンタから集計（保持件数の上限なし）。';
  } else {
    note.textContent = '回答履歴ログから集計。履歴は直近'+MAX_HISTORY.toLocaleString()+'件まで保持（現在'+history.length.toLocaleString()+'件） / 条件に合う件数: '+result.count.toLocaleString()+'件。';
  }
}

function renderStats(){
  const result = computeMatrixData();
  const anyData = renderMatrixTable(result);
  updateStatsRangeNote(result);

  const weakListEl = document.getElementById('weakList');
  const scored = computeWeakList();
  if(!anyData){
    // matrix already shows "-" everywhere; nothing extra needed here
  }
  if(scored.length === 0){
    weakListEl.innerHTML = '<div class="empty-note">十分なデータがまだありません（各問2回以上回答すると表示されます）</div>';
  } else {
    weakListEl.innerHTML = '';
    scored.forEach(s=>{
      const row = document.createElement('div');
      row.className = 'miss-item';
      row.innerHTML = '<span>'+s.item.verb+' / '+s.item.tenseJp+' / '+s.item.personPt+'</span><span class="acc">'+Math.round(s.acc*100)+'%</span>';
      weakListEl.appendChild(row);
    });
  }
}

document.getElementById('resetStatsBtn').addEventListener('click', ()=>{
  if(confirm('これまでの成績データ（累計カウンタと回答履歴の両方）を削除します。よろしいですか？')){
    stats = {};
    history = [];
    saveJSON(LS_STATS, stats);
    saveJSON(LS_HISTORY, history);
    renderStats();
  }
});

refreshPool();
newQuestion();
updateStatDisplay();
